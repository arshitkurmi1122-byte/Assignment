<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Form</title>
  </head>
  <body>
    <h1>Application Form</h1>
    <p>Student Internship Application</p>

    <form>
      <fieldset>
        <legend>Personal Details</legend>

        <label for="name">Full Name:</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Arshit Gangwar"
          required
        />

        <br /><br />

        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="arshitkurmi1122@gmail.com"
          required
        />

        <br /><br />

        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="********"
          required
          minlength="8"
        />

        <br /><br />

        <label for="phone">Phone:</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="7037033453"
          required
        />

        <br /><br />

        <label for="url">LinkedIn:</label>
        <input
          type="url"
          id="url"
          name="url"
          placeholder="https://www.linkedin.com/in/arshit-gangwar-2803s/"
        />

        <br /><br />

        <label for="age">Age:</label>
        <input
          type="number"
          id="age"
          name="age"
          min="18"
          max="30"
          placeholder="19"
        />

        <br /><br />

        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male" />
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female" />
        <label for="female">Female</label>

        <br /><br />

        <label>Skills:</label>
        <input type="checkbox" id="html" name="skills" value="HTML" />
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="CSS" />
        <label for="css">CSS</label>

        <input type="checkbox" id="js" name="skills" value="JavaScript" />
        <label for="js">JavaScript</label>

        <input type="checkbox" id="java" name="skills" value="Java" />
        <label for="java">Java</label>

        <br /><br />

        <label for="course">Course:</label>
        <select id="course" name="course">
          <option value="">Select Course</option>
          <option>B.Tech CSE</option>
          <option>BBA</option>
          <option>BCA</option>
          <option>MCA</option>
        </select>

        <br /><br />

        <label for="city">Preferred City:</label>
        <input list="cities" id="city" name="city" />

        <datalist id="cities">
          <option value="Delhi"></option>
          <option value="Mumbai"></option>
          <option value="Noida"></option>
          <option value="Bangalore"></option>
        </datalist>
      </fieldset>

      <br />

      <fieldset>
        <legend>Upload and Extras</legend>

        <label for="date">Available From:</label>
        <input type="date" id="date" name="26/04/22" />

        <br /><br />

        <label for="time">Interview Time:</label>
        <input type="time" id="time" name="11:11 pm" />

        <br /><br />

        <label for="resume">Resume:</label>
        <input type="file" id="resume" name="resume" />

        <br /><br />

        <label for="stipend">Expected Monthly Stipend:</label>
        <input
          type="range"
          id="stipend"
          name="stipend"
          min="5000"
          max="30000"
        />

        <br /><br />

        <label for="color">Favourite Colour:</label>
        <input type="color" id="color" name="color" />

        <br /><br />

        <label for="reason">Why do you want to join?</label>
        <br />
        <textarea
          id="reason"
          name="reason"
          rows="5"
          cols="40"
          placeholder="Write your reason here"
        ></textarea>
      </fieldset>

      <br />

      <button type="submit">Submit Application</button>
      <button type="reset">Reset</button>
    </form>
  </body>
</html>
