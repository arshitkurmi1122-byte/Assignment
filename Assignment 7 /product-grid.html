<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Grid</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Campus Store</h1>
    <p>Choose your favourite products.</p>

    <!-- Product container -->
    <div class="products">
      <div class="product">
        <img src="https://picsum.photos/id/1/300/200" alt="Laptop" />
        <h3>Laptop</h3>
        <p>₹45,000</p>
      </div>

      <div class="product">
        <img src="https://picsum.photos/id/2/300/200" alt="Computer" />
        <h3>Computer</h3>
        <p>₹35,000</p>
      </div>

      <div class="product">
        <img src="https://picsum.photos/id/3/300/200" alt="Accessories" />
        <h3>Accessories</h3>
        <p>₹999</p>
      </div>

      <div class="product">
        <img src="https://picsum.photos/id/4/300/200" alt="Camera" />
        <h3>Camera</h3>
        <p>₹15,000</p>
      </div>

      <div class="product">
        <img src="https://picsum.photos/id/5/300/200" alt="Watch" />
        <h3>Watch</h3>
        <p>₹2,000</p>
      </div>

      <div class="product">
        <img src="https://picsum.photos/id/6/300/200" alt="Phone" />
        <h3>Phone</h3>
        <p>₹20,000</p>
      </div>
    </div>
  </body>
</html>
